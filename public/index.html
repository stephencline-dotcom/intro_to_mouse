<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands-On Mouse</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  
<section id="teacherLessonMenu" class="teacher-lesson-menu" hidden>

  <div class="lesson-menu-heading">
    <h2>Choose a Lesson</h2>
    <p>Select what you want to teach today.</p>
  </div>

  <div class="lesson-menu-grid">

    <button
      class="lesson-menu-card"
      type="button"
      data-lesson-id="week1"
    >
      <span class="lesson-menu-week">Week 1</span>
      <strong>Move & Left Click</strong>
      <span>Learn mouse movement and left clicking.</span>
    </button>

    <button
      class="lesson-menu-card"
      type="button"
      data-lesson-id="review1"
    >
      <span class="lesson-menu-week">Review</span>
      <strong>Move & Left Click Review</strong>
      <span>Quick practice and review challenge.</span>
    </button>

  </div>

</section>

<main class="home-page">
    <section class="hero">
      <h1>Hands-On Mouse</h1>
      <p>Learn to move, click, and scroll with a mouse.</p>
    </section>

    <section class="activity-grid">
      <button class="activity-card" id="mousePracticeButton">
        <span class="activity-icon">🖱️</span>
        <span class="activity-title">Mouse Practice</span>
        <span class="activity-description">
          Practice moving, clicking, and scrolling.
        </span>
      </button>
    </section>
  </main>
  <a class="teacher-login-link" href="/pages/login.html">
    Teacher Login
  </a>


  <script src="js/shared/lessons.js?v=1"></script>
  <script src="js/shared/teacher-session.js?v=2"></script>
  <script src="js/shared/classroom-bootstrap.js?v=80"></script>
  <script src="js/app.js"></script>

</body>
</html>
